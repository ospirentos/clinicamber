services:
  amber-cms-app:
    container_name: amber-cms
    build:
      context: amber-cms
      dockerfile: ./Dockerfile.prod
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_CLIENT: ${DATABASE_CLIENT}
      DATABASE_HOST: amber-cmsDB
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PORT: ${DATABASE_PORT}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      NODE_ENV: ${NODE_ENV}
    volumes:
      - ./amber-cms/config:/opt/app/config
      - ./amber-cms/src:/opt/app/src
      - ./amber-cms/package.json:/opt/package.json
      - ./amber-cms/package-lock.json:/opt/package-lock.json

      - ./.env:/opt/app/.env
      - ./amber-cms/public/uploads:/opt/app/public/uploads:z
    # No published ports: only reachable through the reverse proxy on the internal network.
    networks:
      - amber-cms
    depends_on:
      amber-cmsDB:
        condition: service_healthy

  amber-cmsDB:
    container_name: amber-cmsDB
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - amber-cms-data:/var/lib/postgresql/data/
    # Never publish the database port. For admin access use an SSH tunnel:
    #   ssh -L 5432:<container-ip>:5432 amber@clinicamber.com
    # or: docker exec -it amber-cmsDB psql -U <user> <db>
    networks:
      - amber-cms
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  reverse-proxy:
    container_name: nginx-reverse-proxy
    restart: unless-stopped
    build:
      context: nginx
      dockerfile: ./Dockerfile.prod
    networks:
      - amber-cms
    ports:
      - 80:80
      - 443:443
    volumes:
      # Mount the whole directory (not single files) so renewed certs are picked up on reload.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - amber-cms-app
      - web-app

  web-app:
    container_name: amber-web-app
    restart: unless-stopped
    build:
      context: amber-web-app
      dockerfile: Dockerfile.prod
    networks:
      - amber-cms
    env_file: .env
    environment:
      - WEB_CMS_BASE_URL=${WEB_CMS_BASE_URL}
      - API_URL=${WEB_API_URL}
      - PUBLIC_WEB_TOKEN=${WEB_PUBLIC_TOKEN}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_API_KEY_SSR=${GOOGLE_API_KEY_SSR}
      - GOOGLE_PLACE_ID=${GOOGLE_PLACE_ID}
      - NODE_ENV=${NODE_ENV}
      - PORT=3000
      - MAIL_SENDER_URL=${MAIL_SENDER_URL}

  mail-sender:
    container_name: amber-mail-sender
    restart: unless-stopped
    build:
      context: amber-mail-service
      dockerfile: ./Dockerfile.prod
    networks:
      - amber-cms
    env_file: .env
    environment:
      - MAIL_SENDER_USERNAME=${MAIL_SENDER_USERNAME}
      - MAIL_SENDER_PASSWORD=${MAIL_SENDER_PASSWORD}
      - MAIL_SENDER_HOST=${MAIL_SENDER_HOST}
      - MAIL_SENDER_PORT=${MAIL_SENDER_PORT}
      - NODE_ENV=${NODE_ENV}
    volumes:
      - mail-sender-logs:/app/logs:z
    healthcheck:
      # node:alpine has no curl; busybox wget is available
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:1338/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  amber-cms-data:
  mail-sender-logs:

networks:
  amber-cms:
    name: Amber-cms
    driver: bridge
